name: Build & Deploy to Production

# Every push to main is deployed to production: a pull request is reviewed on
# __SUBDOMAIN__-acc.shelly-nas.nl (acc.yml), and merging it is the release.
#
# The images are tagged with the commit and with latest; production pins the
# commit, so what runs is always a known commit and a rollback is deploying an
# earlier one ("Run workflow" on that commit or branch).
#
# The production database lives in the external volume __APP__-db-data. The
# deploy creates it on the first run and only reuses it afterwards; no deploy,
# cleanup or `docker compose down -v` removes it.

on:
  push:
    branches:
      - main
  # Redeploy or roll back: run on main, a tag or an earlier commit's branch.
  workflow_dispatch:

permissions:
  contents: read
  # Lets deploy-production.yml look up the merged pull request of the commit
  # on acc, so acc is also torn down after a squash or rebase merge.
  pull-requests: read

# Deploys run one at a time and in order; a newer push waits instead of
# cancelling a deploy halfway.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-server:
    name: Build and Push Server
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/__APP__-server:${{ github.sha }},${{ vars.REGISTRY_URL }}/__APP__-server:latest
      context: ./server
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  build-client:
    name: Build and Push Client
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/__APP__-client:${{ github.sha }},${{ vars.REGISTRY_URL }}/__APP__-client:latest
      context: ./client
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  build-db:
    name: Build and Push Database
    uses: shelly-nas/shared-workflows/.github/workflows/build-push-image.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      image_tag: ${{ vars.REGISTRY_URL }}/__APP__-db:${{ github.sha }},${{ vars.REGISTRY_URL }}/__APP__-db:latest
      context: ./database
    secrets:
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  deploy:
    name: Deploy to Production
    needs: [build-server, build-client, build-db]
    uses: shelly-nas/shared-workflows/.github/workflows/deploy-production.yml@main
    with:
      registry: ${{ vars.REGISTRY_URL }}
      deploy_directory: /volume1/docker/__APP__
      compose_file: docker-compose.prod.yml
      image_tag: ${{ github.sha }}
      # Must match the external volume in docker-compose.prod.yml.
      persistent_volumes: __APP__-db-data
      # Fallback teardown of acc once its commit is in production (acc.yml
      # already removes it when the pull request closes).
      acc_directory: /volume1/docker/__APP__-acc
    secrets:
      registry_username: ${{ vars.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
      env_file_content: |
        DB_NAME=${{ vars.DB_NAME }}
        DB_USER=${{ vars.DB_USER }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        TZ=${{ vars.TZ || 'Europe/Amsterdam' }}
