server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses; the JS and CSS bundles shrink by about 70%.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA routing: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the current bundles, so the browser must always revalidate it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite puts a content hash in every filename under /assets/, so these never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy API calls to the backend service.
    # The upstream is held in a variable so nginx resolves it at request time
    # rather than at startup - otherwise this container fails to boot whenever
    # the server container is not up yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://server:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
